<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="780" viewBox="0 0 1180 780">
  <rect width="100%" height="100%" fill="#f7f3ea"/>
  <text x="32" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1b3a32">7. Sequence: sending the contact form</text>
  <text x="32" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5c5146">The browser posts the form. PHP checks it. Only a valid message is stored.</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#241c14"/>
    </marker>
    <marker id="arrow-r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#8a2e24"/>
    </marker>
  </defs>

<rect x="30" y="100" width="170" height="36" rx="6" fill="#1b3a32" stroke="#1b3a32" stroke-width="2"/>
<text x="115.0" y="124" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#f6f1e6">Browser</text>
<line x1="115.0" y1="136" x2="115.0" y2="700" stroke="#cbbfaa" stroke-width="1.4" stroke-dasharray="4 4"/>
<rect x="230" y="100" width="170" height="36" rx="6" fill="#1b3a32" stroke="#1b3a32" stroke-width="2"/>
<text x="315.0" y="124" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#f6f1e6">contact/index.php</text>
<line x1="315.0" y1="136" x2="315.0" y2="700" stroke="#cbbfaa" stroke-width="1.4" stroke-dasharray="4 4"/>
<rect x="470" y="100" width="170" height="36" rx="6" fill="#1b3a32" stroke="#1b3a32" stroke-width="2"/>
<text x="555.0" y="124" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#f6f1e6">pages.php</text>
<line x1="555.0" y1="136" x2="555.0" y2="700" stroke="#cbbfaa" stroke-width="1.4" stroke-dasharray="4 4"/>
<rect x="690" y="100" width="170" height="36" rx="6" fill="#1b3a32" stroke="#1b3a32" stroke-width="2"/>
<text x="775.0" y="124" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#f6f1e6">contact.php</text>
<line x1="775.0" y1="136" x2="775.0" y2="700" stroke="#cbbfaa" stroke-width="1.4" stroke-dasharray="4 4"/>
<rect x="930" y="100" width="170" height="36" rx="6" fill="#1b3a32" stroke="#1b3a32" stroke-width="2"/>
<text x="1015.0" y="124" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#f6f1e6">files</text>
<line x1="1015.0" y1="136" x2="1015.0" y2="700" stroke="#cbbfaa" stroke-width="1.4" stroke-dasharray="4 4"/>
<line x1="115" y1="170" x2="307" y2="170" stroke="#241c14" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="211.0" y="162" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#241c14">POST /contact  (form fields)</text>
<line x1="315" y1="230" x2="547" y2="230" stroke="#241c14" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="431.0" y="222" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#241c14">handle_contact_request</text>
<line x1="555" y1="290" x2="767" y2="290" stroke="#241c14" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="661.0" y="282" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#241c14">inspect_contact(post)</text>
<line x1="775" y1="350" x2="563" y2="350" stroke="#241c14" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="669.0" y="342" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#241c14">errors, or a clean record</text>
<text x="40" y="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8a2e24">If a field fails: pages.php returns HTTP 200 with the form, the typed values, and data-error beside each bad field. Nothing is written.</text>
<line x1="555" y1="450" x2="767" y2="450" stroke="#241c14" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="661.0" y="442" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#241c14">store_contact(record)   only when valid</text>
<line x1="775" y1="510" x2="1007" y2="510" stroke="#241c14" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="891.0" y="502" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#241c14">append submissions.jsonl</text>
<line x1="775" y1="560" x2="1007" y2="560" stroke="#241c14" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="891.0" y="552" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#241c14">rewrite submissions.json</text>
<line x1="775" y1="620" x2="563" y2="620" stroke="#241c14" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="669.0" y="612" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#241c14">saved message, with time</text>
<line x1="555" y1="680" x2="123" y2="680" stroke="#241c14" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="339.0" y="672" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#241c14">HTTP 200, confirmation, no form</text>
<text x="40" y="740" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1b3a32">A later GET /contact/submissions.json returns those messages as a JSON array, oldest first.</text>
</svg>
