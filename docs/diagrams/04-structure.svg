<rect x="32" y="430" width="360" height="200" rx="8" fill="#fffaf3" stroke="#1b3a32" stroke-width="2"/>
<rect x="32" y="430" width="360" height="36" rx="8" fill="#1b3a32" stroke="#1b3a32" stroke-width="2"/>
<rect x="32" y="448" width="360" height="18" rx="0" fill="#1b3a32" stroke="#1b3a32" stroke-width="2"/>
<text x="44" y="454" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700" fill="#f6f1e6">public/index.php</text>
<text x="44" y="486" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#241c14">Reads path and method.</text>
<text x="44" y="502" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#241c14">Allows GET on the four pages.</text>
<text x="44" y="518" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#241c14">Allows POST only on /contact.</text>
<text x="44" y="534" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#241c14">Allows GET on the submissions list.</text>
<text x="44" y="550" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#241c14">Anything else: 404 or 405.</text>
<text x="44" y="566" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#241c14">Returns CSS files without running them.</text>
<rect x="420" y="430" width="360" height="120" rx="8" fill="#fffaf3" stroke="#1b3a32" stroke-width="2"/>
<rect x="420" y="430" width="360" height="36" rx="8" fill="#1b3a32" stroke="#1b3a32" stroke-width="2"/>
<rect x="420" y="448" width="360" height="18" rx="0" fill="#1b3a32" stroke="#1b3a32" stroke-width="2"/>
<text x="432" y="454" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700" fill="#f6f1e6">public/contact/index.php</text>
<text x="432" y="486" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#241c14">Requires bootstrap.php.</text>
<text x="432" y="502" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#241c14">Calls handle_contact_request.</text>
<rect x="32" y="670" width="1116" height="260" rx="10" fill="#fffaf3" stroke="#1b3a32" stroke-width="2"/>
<text x="48" y="698" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#1b3a32">How a call moves</text>
<text x="48" y="722" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">index.php and contact/index.php are the only files Apache or the PHP server starts.</text>
<text x="48" y="740" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">Both load bootstrap.php, which loads records.php, contact.php, and pages.php.</text>
<text x="48" y="758" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">pages.php asks records.php for the schedule or the fees, and asks contact.php to check or store a message.</text>
<text x="48" y="776" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">contact.php is the only piece that writes. It appends data/submissions.jsonl, then rewrites the public JSON list.</text>
<text x="48" y="794" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">layout_start and layout_end wrap every HTML response, so the header and footer are not copied into each page.</text>
<text x="48" y="812" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">A stored message is one array with keys group, subject, message, name, email, phone, submitted_at.</text>
</svg>
