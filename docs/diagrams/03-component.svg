<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="820" viewBox="0 0 1180 820">
  <rect width="100%" height="100%" fill="#f7f3ea"/>
  <text x="32" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1b3a32">3. Component diagram</text>
  <text x="32" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5c5146">The pieces inside the PHP app, and which piece calls which.</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#241c14"/>
    </marker>
    <marker id="arrow-r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#8a2e24"/>
    </marker>
  </defs>

<rect x="40" y="110" width="250" height="150" rx="10" fill="#fffaf3" stroke="#1b3a32" stroke-width="2"/>
<text x="56" y="138" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#1b3a32">public/index.php</text>
<text x="56" y="162" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">Front door for most URLs.</text>
<text x="56" y="180" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">Chooses the page from the</text>
<text x="56" y="198" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">path and the HTTP method.</text>
<text x="56" y="216" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">404 and 405 live here.</text>
<rect x="40" y="300" width="250" height="130" rx="10" fill="#fffaf3" stroke="#1b3a32" stroke-width="2"/>
<text x="56" y="328" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#1b3a32">public/contact/index.php</text>
<text x="56" y="352" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">Front door for /contact</text>
<text x="56" y="370" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">when that path is a folder.</text>
<text x="56" y="388" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">Hands the request to</text>
<text x="56" y="406" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">handle_contact_request.</text>
<rect x="40" y="470" width="250" height="110" rx="10" fill="#fffaf3" stroke="#1b3a32" stroke-width="2"/>
<text x="56" y="498" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#1b3a32">public/assets/site.css</text>
<text x="56" y="522" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">Vanilla CSS.</text>
<text x="56" y="540" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">Served as a file.</text>
<text x="56" y="558" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">Not run as PHP.</text>
<rect x="390" y="110" width="280" height="200" rx="10" fill="#fffaf3" stroke="#1b3a32" stroke-width="2"/>
<text x="406" y="138" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#1b3a32">src/bootstrap.php</text>
<text x="406" y="162" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">Loads the other PHP files.</text>
<text x="406" y="180" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">Builds the shared header,</text>
<text x="406" y="198" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">navigation, and footer.</text>
<text x="406" y="216" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">Escapes text.</text>
<text x="406" y="234" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">Reads the request path.</text>
<text x="406" y="252" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">Knows where data/ is.</text>
<rect x="390" y="350" width="280" height="180" rx="10" fill="#fffaf3" stroke="#1b3a32" stroke-width="2"/>
<text x="406" y="378" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#1b3a32">src/pages.php</text>
<text x="406" y="402" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">Writes the HTML for each page.</text>
<text x="406" y="420" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">Home, program, fees, contact,</text>
<text x="406" y="438" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">not-found, method-not-allowed.</text>
<text x="406" y="456" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">Calls the record and contact</text>
<text x="406" y="474" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">pieces. Does not read files itself.</text>
<rect x="760" y="110" width="380" height="170" rx="10" fill="#e7f0ea" stroke="#1b3a32" stroke-width="2"/>
<text x="776" y="138" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#1b3a32">src/records.php</text>
<text x="776" y="162" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">Reads a JSON file on every request.</text>
<text x="776" y="180" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">program_records() -&gt; program.json</text>
<text x="776" y="198" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">fee_records() -&gt; fees.json</text>
<text x="776" y="216" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">Nothing from the schedule is</text>
<text x="776" y="234" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">copied into the PHP files.</text>
<rect x="760" y="320" width="380" height="230" rx="10" fill="#e7f0ea" stroke="#1b3a32" stroke-width="2"/>
<text x="776" y="348" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#1b3a32">src/contact.php</text>
<text x="776" y="372" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">Checks the posted form.</text>
<text x="776" y="390" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">On success, appends one JSON line</text>
<text x="776" y="408" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">to data/submissions.jsonl.</text>
<text x="776" y="426" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">Rewrites public/contact/submissions.json</text>
<text x="776" y="444" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">from that file.</text>
<text x="776" y="462" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">read_contacts() builds the JSON list.</text>
<rect x="390" y="580" width="750" height="190" rx="10" fill="#fffaf3" stroke="#1b3a32" stroke-width="2"/>
<text x="406" y="608" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#1b3a32">Files these pieces touch</text>
<text x="406" y="632" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">data/program.json          published days and sessions. Read only.</text>
<text x="406" y="650" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">data/fees.json             published fee tables. Read only.</text>
<text x="406" y="668" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">data/submissions.jsonl     one stored message per line. The store.</text>
<text x="406" y="686" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#241c14">public/contact/submissions.json    the same messages as a JSON array.</text>
<line x1="290" y1="180" x2="390" y2="180" stroke="#241c14" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="340" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3d3428">requires</text>
<line x1="290" y1="360" x2="390" y2="400" stroke="#241c14" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="330" y="360" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3d3428">calls</text>
<line x1="670" y1="200" x2="760" y2="180" stroke="#241c14" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="720" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3d3428">pages call</text>
<line x1="670" y1="430" x2="760" y2="400" stroke="#241c14" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="710" y="400" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3d3428">pages call</text>
</svg>
